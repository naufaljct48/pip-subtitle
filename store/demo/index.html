<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coastline — Demo Player</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0d12; color: #e5e7eb; font: 15px/1.5 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 28px; border-bottom: 1px solid #1f2430; }
  header b { font-size: 16px; letter-spacing: .2px; }
  header span { color: #8b93a3; }
  main { max-width: 1040px; margin: 28px auto; padding: 0 28px; }
  .player { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; }
  .player video { width: 100%; height: 100%; display: block; }
  /* Captions rendered as HTML over the video, like most web players do. */
  .demo-captions { position: absolute; left: 0; right: 0; bottom: 8%; text-align: center; pointer-events: none; }
  .demo-captions span { display: inline; white-space: pre-line; background: rgba(0,0,0,.6); color: #fff;
    font: 600 26px/1.35 system-ui, sans-serif; padding: 2px 10px; border-radius: 4px;
    -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  h1 { font-size: 22px; margin: 18px 0 4px; }
  p { color: #8b93a3; margin: 0; }
</style>
</head>
<body>
<header><b>Demo Player</b><span>· sample short film</span></header>
<main>
  <div class="player">
    <video id="v" src="demo.mp4" playsinline loop muted></video>
    <div class="demo-captions" aria-live="off"><span id="cap"></span></div>
  </div>
  <h1 id="title">Coastline</h1>
  <p id="sub">A 20-second sample with HTML subtitles — the kind regular Picture-in-Picture drops.</p>
</main>
<script>
const lang = new URLSearchParams(location.search).get('lang') === 'id' ? 'id' : 'en';
document.documentElement.lang = lang;
const CUES = {
  en: [[0.3, 4.6, 'The tide always comes back.'], [4.9, 9.4, 'So do the people\nwho learn how to leave.'],
       [11.0, 15.2, 'Walk with me.\nThe rain won\'t wait for us.'], [15.5, 20.5, 'Neither will the last tram home.']],
  id: [[0.3, 4.6, 'Ombak selalu kembali.'], [4.9, 9.4, 'Begitu juga orang\nyang belajar untuk pergi.'],
       [11.0, 15.2, 'Jalanlah bersamaku.\nHujan tak akan menunggu.'], [15.5, 20.5, 'Begitu juga trem terakhir ke rumah.']],
}[lang];
if (lang === 'id') {
  document.getElementById('sub').textContent = 'Contoh 20 detik dengan subtitle HTML — jenis yang hilang di Picture-in-Picture biasa.';
}
const v = document.getElementById('v');
const cap = document.getElementById('cap');
const tick = () => {
  const t = v.currentTime;
  const c = CUES.find(([a, b]) => t >= a && t < b);
  const text = c ? c[2] : '';
  if (cap.textContent !== text) cap.textContent = text;
  cap.style.display = text ? '' : 'none';
};
setInterval(tick, 100);
v.addEventListener('seeked', tick);
const start = Number(new URLSearchParams(location.search).get('t') || 0);
v.addEventListener('loadedmetadata', () => { if (start) v.currentTime = start; });
v.play().catch(() => {});
</script>
</body>
</html>
