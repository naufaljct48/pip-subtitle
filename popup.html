<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>PiP Subtitle</title>
<style>
  :root {
    --bg: #fff; --text: #111; --muted: #6b7280; --border: #e5e7eb; --accent: #2563eb;
    --track: #d1d5db;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --text: #f5f5f7; --muted: #9ca3af; --border: #2c2c2e; --accent: #3b82f6;
      --track: #48484a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 300px; padding: 16px; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, sans-serif;
  }
  button { font: inherit; color: inherit; }
  button:focus { outline: none; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .header img { width: 20px; height: 20px; display: block; }
  .header h1 { margin: 0; font: 600 14px/1.2 system-ui, sans-serif; }

  .primary {
    position: relative; width: 100%; height: 36px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font-weight: 600; cursor: pointer;
  }
  .primary:hover { filter: brightness(1.08); }
  .primary:disabled { opacity: .6; cursor: default; }
  .primary kbd {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font: 12px/1 system-ui, sans-serif; color: rgba(255, 255, 255, .7);
  }

  .section { margin-top: 16px; }
  .section-label { margin: 0 0 6px; font-weight: 600; }
  .segmented {
    display: grid; grid-template-columns: 1fr 1fr; height: 32px; padding: 2px; gap: 2px;
    border: 1px solid var(--border); border-radius: 8px;
  }
  .segmented button {
    border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer;
  }
  .segmented button[aria-checked="true"] {
    color: var(--accent); font-weight: 600;
    background: color-mix(in srgb, var(--accent) 14%, transparent);
  }
  .hint { margin: 6px 0 0; font-size: 12px; color: var(--muted); }

  .rows { margin-top: 12px; border-top: 1px solid var(--border); }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 44px; padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .row .hint { margin-top: 2px; }

  .switch {
    flex: 0 0 auto; position: relative; width: 36px; height: 20px; padding: 0; border: 0;
    border-radius: 10px; background: var(--track); cursor: pointer; transition: background .15s;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3);
    transition: transform .15s;
  }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(16px); }

  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button {
    width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 8px;
    background: transparent; cursor: pointer; line-height: 1;
  }
  .stepper button:disabled { opacity: .4; cursor: default; }
  .stepper output { min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }

  .msg { margin: 12px 0 0; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="">
    <h1>PiP Subtitle</h1>
  </div>

  <button type="button" class="primary" id="open">Buka PiP<kbd>Alt+P</kbd></button>

  <div class="section">
    <p class="section-label" id="mode-label">Mode tampilan</p>
    <div class="segmented" role="radiogroup" aria-labelledby="mode-label">
      <button type="button" role="radio" data-mode="clean" aria-checked="true">Bersih</button>
      <button type="button" role="radio" data-mode="full" aria-checked="false">Lengkap</button>
    </div>
    <p class="hint" id="mode-hint"></p>
  </div>

  <div class="rows">
    <div class="row">
      <div>
        <div id="auto-label">PiP otomatis saat pindah tab</div>
        <p class="hint">Video harus sedang main dan bersuara.</p>
      </div>
      <button type="button" class="switch" id="auto" role="switch" aria-checked="true" aria-labelledby="auto-label"></button>
    </div>
    <div class="row">
      <div id="cc-label">Tampilkan subtitle</div>
      <button type="button" class="switch" id="cc" role="switch" aria-checked="true" aria-labelledby="cc-label"></button>
    </div>
    <div class="row">
      <div id="size-label">Ukuran teks</div>
      <div class="stepper" role="group" aria-labelledby="size-label">
        <button type="button" id="smaller" aria-label="Perkecil teks">−</button>
        <output id="size" aria-live="polite">100%</output>
        <button type="button" id="bigger" aria-label="Perbesar teks">+</button>
      </div>
    </div>
  </div>

  <p class="msg" id="msg" role="status" hidden></p>

  <script src="popup.js"></script>
</body>
</html>
